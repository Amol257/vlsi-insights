[build]
  publish = "."

# ─── Cache-Control Headers ───────────────────────────────────────────────────
# CSS & JS — cache for 1 year (they are fingerprinted by deployment)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images — cache for 1 year
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — always re-validate so content stays fresh
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"


[[redirects]]
  from = "/blog/css/*"
  to = "/css/:splat"
  status = 200


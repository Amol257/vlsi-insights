[build]
  base = "frontend"
  publish = "."

# ─── Cache-Control Headers ───────────────────────────────────────────────────
# CSS & JS — cache for 1 year (they are fingerprinted by deployment)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images — cache for 1 year
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — always re-validate so content stays fresh
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/pages/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"


# ─── Static Asset Rewrites ───────────────────────────────────────────────────
[[redirects]]
  from = "/pages/index.html"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/pages/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/pages/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/pages/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/blog/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/blog/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/blog/js/*"
  to = "/js/:splat"
  status = 200


# ─── Dynamic Blog Routing ────────────────────────────────────────────────────
[[redirects]]
  from = "/blog/:slug"
  to = "/pages/post.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/pages/blog.html"
  status = 200

[[redirects]]
  from = "/blogs"
  to = "/pages/blog.html"
  status = 200

[[redirects]]
  from = "/post"
  to = "/pages/post.html"
  status = 200


